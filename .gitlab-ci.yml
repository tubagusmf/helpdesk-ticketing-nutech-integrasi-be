workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"'
    - when: never

stages:
  - runner-test

runner_verification:
  stage: runner-test

  image: alpine:3.22

  tags:
    - nutech-rocky9

  script:
    - |
      echo "=================================="
      echo "GITLAB BACKEND RUNNER BERHASIL"
      echo "=================================="
      echo "Project: ${CI_PROJECT_PATH}"
      echo "Branch: ${CI_COMMIT_REF_NAME}"
      echo "Commit: ${CI_COMMIT_SHORT_SHA}"
      echo "Backend CI/CD Runner Test SUCCESS"
