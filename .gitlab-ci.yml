stages:
  - runner-test

runner_verification:
  stage: runner-test

  image: alpine:3.22

  tags:
    - saas-linux-small-amd64

  script:
    - echo "=================================="
    - echo "GITLAB RUNNER BERHASIL DIJALANKAN"
    - echo "=================================="
    - echo "Project: $CI_PROJECT_PATH"
    - echo "Branch: $CI_COMMIT_REF_NAME"
